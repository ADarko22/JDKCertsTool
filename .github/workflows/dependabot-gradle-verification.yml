name: Sync Gradle Verification Metadata

# This workflow regenerates the verification-metadata.xml manifest
# on Dependabot Gradle PRs and pushes it back to the PR branch so the build can pass.

on:
  pull_request:
    branches: [ master ]
    paths:
      - 'gradle/libs.versions.toml'
      - 'gradle/wrapper/gradle-wrapper.properties'
      - '**/build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'

# The push back to the PR branch is done via DEPENDABOT_METADATA_PAT, not GITHUB_TOKEN.
permissions:
  contents: read

jobs:
  sync-verification-metadata:
    # Only Dependabot PRs: they are in-repo branches (so we can push) and human dependency changes are
    # expected to refresh the manifest manually (see DEVELOPMENT.md).
    if: github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout PR branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.head_ref }}

      - name: Set up JDK 21
        uses: actions/setup-java@1bcf9fb12cf4aa7d266a90ae39939e61372fe520 # v5.4.0
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0

      # Write mode records the checksums Gradle downloads instead of enforcing them, so a stale or
      # missing entry does not fail the run.
      - name: Regenerate dependency verification metadata
        run: ./gradlew --write-verification-metadata sha256 --no-configuration-cache build

      - name: Commit & push updated metadata
        env:
          PAT: ${{ secrets.DEPENDABOT_METADATA_PAT }}
        run: |
          if git diff --quiet -- gradle/verification-metadata.xml; then
            echo "verification-metadata.xml already up to date; nothing to push."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gradle/verification-metadata.xml
          git commit -m "chore: update gradle dependency verification metadata"
          git push "https://x-access-token:${PAT}@github.com/${{ github.repository }}.git" \
            "HEAD:${{ github.head_ref }}"
