name: Release JDKCertsTool

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release version tag (e.g., v1.0.0)'
        required: true

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest

    env:
      TAG: ${{ inputs.tag }}

    outputs:
      version: ${{ steps.calc_versions.outputs.version }}
      next_snapshot: ${{ steps.calc_versions.outputs.next_snapshot }}

    steps:
      # Always release master's current HEAD
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: master
          fetch-depth: 0

      - name: Calculate and Validate Versions
        id: calc_versions
        run: |
          RAW_VERSION="$TAG"

          # Fail-fast validation: Ensure it matches semantic format (e.g., 1.0.0 or v1.0.0)
          if [[ ! "$RAW_VERSION" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Invalid version tag format '$RAW_VERSION'. Must be X.Y.Z or vX.Y.Z"
            exit 1
          fi

          # Strip the 'v' prefix if present
          CLEAN_VERSION="${RAW_VERSION#v}"
          echo "version=$CLEAN_VERSION" >> $GITHUB_OUTPUT

          # Idiomatic AWK bump: sets Output Field Separator to '.' and increments last digit
          NEXT_SNAPSHOT=$(echo "$CLEAN_VERSION" | awk -F. -v OFS=. '{$NF = $NF + 1; print $0 "-SNAPSHOT"}')
          echo "next_snapshot=$NEXT_SNAPSHOT" >> $GITHUB_OUTPUT

  build:
    needs: prepare
    strategy:
      matrix:
        include:
          - os: macos-14
            os-name: darwin
            arch: arm64
          - os: macos-15-intel
            os-name: darwin
            arch: amd64
          # Pinned to 22.04 (glibc 2.35) rather than ubuntu-latest (24.04, glibc 2.39) so the
          # binary runs on the current and previous Ubuntu/Debian/RHEL LTS.
          - os: ubuntu-22.04
            os-name: linux
            arch: amd64
    runs-on: ${{ matrix.os }}

    env:
      RELEASE_VERSION: ${{ needs.prepare.outputs.version }}

    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: master

      - name: Set up GraalVM 25
        uses: ./.github/actions/setup-graalvm
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0

      - name: Build native image
        run: ./gradlew nativeCompile -PprojectVersion="$RELEASE_VERSION"

      # homebrew-releaser (see the publish job) expects release assets named
      # exactly {repo_name}-{version}-{operating_system}-{architecture}.tar.gz
      - name: Package artifact
        run: |
          mkdir -p release
          cp build/native/nativeCompile/jdkcerts jdkcerts
          tar -czf "release/JDKCertsTool-${RELEASE_VERSION}-${{ matrix.os-name }}-${{ matrix.arch }}.tar.gz" jdkcerts
          rm jdkcerts

      - name: Upload native artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: jdkcerts-${{ matrix.os-name }}-${{ matrix.arch }}
          path: release/*.tar.gz

      # The fat jar is platform-independent, so it only needs to be built once.
      # This leg already has a JDK 25-capable GraalVM installed, so it's built here
      # instead of in a separate job.
      - name: Build fat jar
        if: matrix.os-name == 'linux' && matrix.arch == 'amd64'
        run: ./gradlew shadowJar -PprojectVersion="$RELEASE_VERSION"

      - name: Rename fat jar for release
        if: matrix.os-name == 'linux' && matrix.arch == 'amd64'
        run: |
          mkdir -p release-jar
          cp "build/libs/JDKCertsTool-${RELEASE_VERSION}-all.jar" "release-jar/JDKCertsTool-${RELEASE_VERSION}.jar"

      - name: Upload fat jar artifact
        if: matrix.os-name == 'linux' && matrix.arch == 'amd64'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: jdkcerts-jar
          path: release-jar/*.jar

  publish:
    needs: [ prepare, build ]
    runs-on: ubuntu-latest

    env:
      TAG: ${{ inputs.tag }}
      RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
      NEXT_SNAPSHOT: ${{ needs.prepare.outputs.next_snapshot }}

    permissions:
      contents: write # Needed for creating releases, tags, and pushing the version bump

    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: master
          fetch-depth: 0 # Needed for git operations like rebasing the version bump
          token: ${{ secrets.PUSH_TO_MAIN_TOKEN }}

      - name: Download all release assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: release
          pattern: jdkcerts-*
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@718ea10b132b3b2eba29c1007bb80653f286566b # v3.0.1
        with:
          tag_name: ${{ inputs.tag }}
          name: "Release ${{ inputs.tag }}"
          draft: false
          prerelease: false
          files: |
            release/*.tar.gz
            release/*.jar

      - name: Update Homebrew Formula
        uses: Justintime50/homebrew-releaser@454cc0d45a99949c9ea0bd9f03e6309df1617628 # v4.0.0
        with:
          homebrew_owner: ADarko22
          homebrew_tap: homebrew-tap
          github_token: ${{ secrets.TAP_GITHUB_TOKEN }}
          install: 'bin.install "jdkcerts"'
          test: 'assert_match "Streamline your JDK certificate management workflow", shell_output("#{bin}/jdkcerts info")'
          target_darwin_amd64: true
          target_darwin_arm64: true
          target_linux_amd64: true
          # homebrew-releaser builds the asset download URL as
          # .../releases/download/{version}/... — {version} must match the real
          # release tag (e.g. "v3.0.0"), not the stripped RELEASE_VERSION.
          version: ${{ inputs.tag }}

      - name: Commit and push next snapshot to master
        run: |
          # Configure Git as a bot
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Fetch and rebase right before making changes to minimize race condition failures
          git pull origin master --rebase

          # Replaces the line starting with "projectVersion=" with the new snapshot version
          sed -i "s/^projectVersion=.*/projectVersion=${NEXT_SNAPSHOT}/" gradle.properties

          # Stage and commit only if something actually changed — reruns after a partial
          # failure (or re-releasing an already-bumped version) would otherwise fail here
          # with "nothing to commit" after the release/formula have already been published.
          git add gradle.properties
          git diff --cached --quiet || git commit -m "chore: bump version to ${NEXT_SNAPSHOT} [skip ci]"
          git push origin HEAD:master
