name: Set up JDK 25
description: Sets up the Temurin JDK 25 toolchain used across CI workflows

runs:
  using: composite
  steps:
    - name: Set up JDK 25
      uses: actions/setup-java@1bcf9fb12cf4aa7d266a90ae39939e61372fe520 # v5.4.0
      with:
        java-version: '25'
        distribution: 'temurin'
