name: 💡 Feature Request
description: Suggest an idea or enhancement for JDKCertsTool
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting an improvement!

        JDKCertsTool has a deliberately narrow scope — it manages the JDK **truststore** (`TrustedCertEntry`), not the
        application **keystore** (`PrivateKeyEntry`). See the
        [scope section](../blob/master/README.md#-scope-the-jdk-truststore-not-the-application-keystore).
  - type: textarea
    id: problem
    attributes:
      label: Problem / motivation
      description: What problem are you trying to solve? What's the concrete scenario?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe what you'd like to happen — new command, flag, platform support, etc.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Any workarounds or alternative approaches you've thought about.
    validations:
      required: false
  - type: checkboxes
    id: scope
    attributes:
      label: Scope check
      options:
        - label: This concerns the JDK **truststore** (trusted CA / public certs), not application private keys.
          required: true
