name: 🐛 Bug Report
description: Report a problem with JDKCertsTool
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a bug report!

        ⚠️ **Do not report security vulnerabilities here** — please follow the [Security Policy](../blob/master/SECURITY.md) instead.
  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear and concise description of what the bug is.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: The exact command(s) you ran and the full output. Use `--dry-run` where possible.
      placeholder: |
        1. Ran: jdkcerts install-cert --cert ./corp-ca.pem --alias corp-ca --dry-run
        2. Output: ...
      render: shell
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen instead?
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: "Paste the output of `jdkcerts info`, plus your OS/architecture."
      placeholder: |
        - OS: macOS 15.5 (arm64)
        - jdkcerts version:
        - Output of `jdkcerts info`:
      render: shell
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Anything else that might help (logs, screenshots, discovered JDKs, custom `--custom-jdk-paths`, etc.).
    validations:
      required: false
